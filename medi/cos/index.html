<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Laboratori de l'Ossi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../comu/comu.css">
<style>
  body { background: radial-gradient(circle at 15% 10%, rgba(255,255,255,.18) 0%, transparent 40%), linear-gradient(160deg, #0f766e 0%, #0d9488 45%, #15803d 100%); }
  #app { min-height: 100vh; }
  .wrap { padding: 76px 16px 40px; max-width: 1000px; margin: 0 auto; text-align: center; }
  .wrap h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.8rem); text-shadow: 0 4px 0 rgba(0,0,0,.25); }

  /* Ossi */
  .ossi { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
  .ossi.happy { animation: jump .5s; }
  .ossi.sad { animation: shake .45s; }
  @keyframes jump { 30% { transform: translateY(-18px) rotate(-6deg); } 60% { transform: translateY(0) scale(.97, 1.03); } }
  .hero-ossi { width: 170px; margin: 0 auto; animation: bob 2.4s ease-in-out infinite; }
  .hero-ossi.small { width: 120px; cursor: pointer; }
  .belly { font-size: 1.2rem; margin-top: 6px; font-weight: 600; }

  /* nivells */
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; margin-top: 18px; }
  .lvl { background: rgba(255,255,255,.95); color: var(--ink); border-radius: 24px; padding: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .lvl .le { font-size: 2.8rem; }
  .lvl .ln { font-size: 1.3rem; font-weight: 700; }
  .lvl .ld { font-size: .95rem; opacity: .7; min-height: 2.4em; }
  .lvl.locked { opacity: .5; filter: grayscale(.8); }
  @media (max-width: 520px) { .levels { grid-template-columns: 1fr 1fr; gap: 10px; } .lvl { padding: 10px 8px; } .lvl .le { font-size: 2.2rem; } .lvl .ln { font-size: 1.05rem; } .lvl .ld { font-size: .8rem; } }
  .lvl.next { animation: pulse 1.6s infinite; box-shadow: 0 6px 0 #f5a623, 0 0 0 4px #ffd23f; }

  /* joc */
  .play { padding: 70px 14px 30px; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
  .play-head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 1.4rem; font-weight: 700; }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .dots span { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: .8rem; }
  .dots span.cur { box-shadow: 0 0 0 3px #fff; }
  .guide { display: flex; align-items: center; gap: 10px; }
  .guide .gchar { width: 70px; flex: none; }
  .guide .gbubble { flex: 1; background: var(--paper); color: var(--ink); border-radius: 20px; padding: 12px 16px; font-size: 1.25rem; line-height: 1.35; position: relative; }
  .guide .gbubble::before { content: ''; position: absolute; left: -12px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right-color: var(--paper); border-left: 0; }
  .area { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; position: relative; }
  .foot { text-align: center; min-height: 80px; }

  /* figures */
  .figbox { position: relative; background: rgba(255,255,255,.96); border-radius: 24px; padding: 8px; box-shadow: 0 6px 0 rgba(0,0,0,.18); flex: none; }
  .figbox svg { display: block; height: min(54vh, 470px); width: auto; aspect-ratio: 1 / 2; touch-action: manipulation; cursor: pointer; }
  .figbox.face svg { height: auto; width: min(80vw, 340px); aspect-ratio: 200 / 220; }
  .figbox.mid svg { height: min(46vh, 400px); }
  .figbox.small svg { height: min(32vh, 280px); }
  .figbox.face.small svg { width: auto; height: min(30vh, 250px); }
  .figlabel { position: absolute; left: 0; right: 0; margin: 0 auto; top: 8px; background: var(--ink); color: #fff; border-radius: 999px; padding: 3px 12px; font-weight: 600; font-size: 1.05rem; max-width: 94%; width: fit-content; text-align: center; line-height: 1.2; pointer-events: none; animation: pop .3s both; }
  .mk { fill: rgba(255, 210, 63, .38); stroke: #ff9800; stroke-width: 3; animation: glow .9s ease-in-out infinite alternate; }
  .mkp, .mkp * { fill: none; stroke: #ffb300; stroke-width: 9px; stroke-opacity: .75; animation: glow .9s ease-in-out infinite alternate; }
  .mkp.ok, .mkp.ok * { stroke: #1e9e55; animation: none; }
  .mkp.bad, .mkp.bad * { stroke: #e53935; animation: none; }
  .mk.ok { fill: rgba(46, 204, 113, .4); stroke: #1e9e55; animation: none; }
  .mk.bad { fill: rgba(255, 90, 95, .4); stroke: #e53935; animation: none; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }

  .learn, .qrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; width: 100%; }
  .learn.tall, .qrow.tall { flex-wrap: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 520px; }
  .learn.tall .chips { flex-direction: column; flex-wrap: nowrap; max-width: 190px; }
  .chip { background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 1.05rem; font-weight: 600; box-shadow: 0 4px 0 #a9aec9; }
  .chip.seen { background: #eafff1; box-shadow: 0 4px 0 #2ecc71; }
  .chip.cur { background: #fff3c4; box-shadow: 0 4px 0 #ff9800; }
  .choices.col { grid-template-columns: 1fr; max-width: 230px; flex: 1; min-width: 0; }
  .choices.two { grid-template-columns: 1fr 1fr; max-width: 560px; }
  .choices.one { grid-template-columns: 1fr; max-width: 520px; }
  .choices.tf .choice { font-size: 1.7rem; }
  .qemoji { font-size: 5rem; line-height: 1; animation: pop .4s both; }
  .statement { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 18px 20px; font-size: 1.5rem; font-weight: 600; line-height: 1.35; max-width: 620px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
  .statement .icon-btn { background: #eee; color: #333; vertical-align: middle; margin-left: 6px; }

  .sec { grid-column: 1 / -1; text-align: left; font-size: 1.35rem; font-weight: 700; margin-top: 10px; text-shadow: 0 2px 0 rgba(0,0,0,.2); }

  /* ordenar */
  .order { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 560px; }
  .ord-slots { display: flex; flex-direction: column; gap: 7px; width: 100%; }
  .oslot { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 16px; min-height: 48px; padding: 6px 12px; text-align: left; font-size: 1.15rem; font-weight: 600; border-bottom: 4px solid #a9aec9; }
  .oslot .on { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #0d9488; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .oslot.right { background: #b9f6ca; border-color: #2ecc71; }
  .ord-bank .chip { font-size: 1.2rem; padding: 10px 16px; }
  .chip.used { visibility: hidden; }

  /* sentits */
  .senses { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; width: 100%; max-width: 820px; }
  .sense { background: #fff; color: var(--ink); border-radius: 22px; padding: 14px 8px; box-shadow: 0 6px 0 #a9aec9; }
  .sense .se { font-size: 3.2rem; line-height: 1.1; }
  .sense .sn { font-size: 1.35rem; font-weight: 700; }
  .sense .so { font-size: 1rem; color: #0d9488; font-weight: 600; }
  .sense.seen { box-shadow: 0 6px 0 #2ecc71; background: #eafff1; }
  .sense.cur { box-shadow: 0 6px 0 #ff9800; background: #fff3c4; }

  @media (max-width: 520px) {
    .guide .gchar { width: 54px; } .guide .gbubble { font-size: 1.05rem; }
    .figbox { padding: 5px; border-radius: 18px; }
    .figbox svg { height: min(50vh, 420px); }
    .figbox.mid svg { height: min(42vh, 360px); }
    .learn.tall { gap: 8px; }
    .learn.tall .chips { max-width: 150px; gap: 5px; }
    .chip { font-size: .92rem; padding: 6px 10px; }
    .choices.col .choice { font-size: 1.05rem; min-height: 54px; padding: 8px 6px; }
    .choices.two .choice { font-size: 1.15rem; }
    .senses { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .sense .se { font-size: 2.6rem; }
    .statement { font-size: 1.25rem; padding: 14px; }
    .qemoji { font-size: 4rem; }
    .figlabel { font-size: .9rem; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../comu/comu.js"></script>
<script src="dades.js"></script>
<script src="aparells.js"></script>
<script src="joc.js"></script>
</body>
</html>
