<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missió Galàxia Numèrica</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../comu/comu.css">
<style>
  body { background: radial-gradient(ellipse at 50% 120%, #3a1c71 0%, #10153a 55%, #05071a 100%); }
  #stars { position: fixed; inset: 0; z-index: -1; }
  #app { min-height: 100vh; }

  /* ---- Mapa de planetes ---- */
  .map { padding: 76px 16px 40px; max-width: 1100px; margin: 0 auto; text-align: center; }
  .map h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.8rem); }
  .map .crystals { font-size: 1.3rem; margin: 6px 0 20px; opacity: .95; }
  .planets { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 34px; }
  .planet { width: 150px; background: none; text-align: center; position: relative; padding: 0; }
  .planet:nth-child(even) { transform: translateY(46px); }
  .planet .orb {
    width: 124px; height: 124px; margin: 0 auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 3.4rem;
    background: radial-gradient(circle at 32% 30%, var(--c1), var(--c2) 70%);
    box-shadow: inset -12px -14px 0 rgba(0,0,0,.22), 0 0 30px var(--c1);
    position: relative; transition: transform .2s;
  }
  .planet .orb::after {
    content: ''; position: absolute; left: -16px; right: -16px; top: 50%; height: 22px; margin-top: -11px;
    border: 4px solid rgba(255,255,255,.35); border-radius: 50%; transform: rotate(-18deg);
  }
  .planet:hover .orb { transform: scale(1.06) rotate(-4deg); }
  .planet .pname { font-weight: 700; font-size: 1.15rem; margin-top: 12px; }
  .planet .pskill { font-size: .9rem; opacity: .8; }
  .planet.locked .orb { filter: grayscale(1) brightness(.55); box-shadow: inset -12px -14px 0 rgba(0,0,0,.22); }
  .planet.locked .orb::before { content: '🔒'; position: absolute; font-size: 2.2rem; right: -6px; bottom: -6px; z-index: 2; }
  .planet.next .orb { animation: pulse 1.6s infinite; }
  .planet .ship { position: absolute; top: -32px; right: 2px; font-size: 2.4rem; animation: bob 1.8s infinite; z-index: 3; }
  .map-btns { margin-top: 80px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---- Pantalla de joc ---- */
  .play { padding: 70px 14px 30px; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
  .play-head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .play-head .ptitle { font-size: 1.5rem; font-weight: 700; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .dots span.cur { background: rgba(255,255,255,.4); box-shadow: 0 0 0 3px #fff; }
  .guide { display: flex; align-items: center; gap: 10px; }
  .guide .gchar { font-size: 3.4rem; flex: none; animation: bob 2s infinite; }
  .guide .gbubble { flex: 1; background: var(--paper); color: var(--ink); border-radius: 20px; padding: 12px 16px; font-size: 1.25rem; line-height: 1.35; position: relative; }
  .guide .gbubble::before { content: ''; position: absolute; left: -12px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right-color: var(--paper); border-left: 0; }
  .guide .gbtns { display: flex; flex-direction: column; gap: 6px; }
  .area { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 8px 0; }
  .foot { text-align: center; min-height: 80px; }

  .big-num { font-size: clamp(3rem, 12vw, 5.5rem); font-weight: 700; letter-spacing: .04em; text-shadow: 0 5px 0 rgba(0,0,0,.35); line-height: 1.1; }
  .big-num .hl { color: var(--gold); text-decoration: underline wavy; text-underline-offset: 10px; }
  .card { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25); border-radius: 22px; padding: 14px 20px; text-align: center; }
  .text-num { font-size: clamp(1.5rem, 5vw, 2.3rem); font-weight: 600; color: #fff; }

  /* columnes DM UM C D U */
  .cols { display: flex; gap: 10px; justify-content: center; }
  .col { width: 86px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(255,255,255,.08); border: 3px solid var(--c); border-radius: 20px; padding: 8px 4px; }
  .col.wrong { background: rgba(255,90,95,.35); }
  .col.right { background: rgba(46,204,113,.35); }
  .col-k { font-weight: 700; font-size: 1.5rem; color: var(--c); }
  .col-d { font-size: 2.8rem; font-weight: 700; line-height: 1; }
  .col button { width: 60px; height: 44px; border-radius: 12px; background: var(--c); color: #222; font-size: 1.3rem; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .col button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .col-tube { width: 26px; height: 110px; border-radius: 13px; background: rgba(0,0,0,.25); display: flex; flex-direction: column-reverse; align-items: center; padding: 3px 0; gap: 2px; }
  .col-tube i { width: 22px; height: 10px; border-radius: 6px; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); animation: pop .25s both; }
  .dec-line { font-size: 1.3rem; text-align: center; line-height: 1.6; min-height: 2.5em; }
  .chip { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--c); color: #222; font-weight: 700; margin: 2px; }
  .expr { font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; text-align: center; line-height: 1.8; }
  .expr .chip { font-size: inherit; padding: 2px 16px; }
  @media (max-width: 520px) {
    .cols { gap: 5px; } .col { width: 62px; } .col button { width: 46px; } .col-d { font-size: 2.1rem; } .col-k { font-size: 1.15rem; }
    .guide .gchar { font-size: 2.6rem; } .guide .gbubble { font-size: 1.05rem; }
  }

  /* fitxes de paraules */
  .tiles-answer { min-height: 76px; width: 100%; max-width: 820px; background: rgba(255,255,255,.95); border-radius: 18px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; border-bottom: 5px solid #a9aec9; }
  .tiles-answer:empty::before { content: 'Toca les paraules en ordre…'; color: #999; font-size: 1.2rem; }
  .tiles-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 820px; }
  .wtile { padding: 10px 16px; border-radius: 14px; font-size: 1.45rem; font-weight: 600; background: linear-gradient(#e9dcff, #b388ff); color: #2a1155; box-shadow: 0 5px 0 #7e57c2; }
  .wtile:active { transform: translateY(3px); box-shadow: 0 2px 0 #7e57c2; }
  .solution { background: #b9f6ca; color: #0b4d26; border-radius: 16px; padding: 10px 18px; font-size: 1.4rem; font-weight: 600; text-align: center; animation: pop .4s both; }
  .note { background: #fff3c4; color: #5a4300; border-radius: 16px; padding: 10px 18px; font-size: 1.15rem; text-align: center; }
  .txt-input { width: 100%; max-width: 760px; font-size: 1.7rem; padding: 14px 18px; border-radius: 18px; border: none; border-bottom: 5px solid #a9aec9; outline: none; color: var(--ink); text-align: center; -webkit-user-select: text; user-select: text; }
  .txt-input.right { background: #b9f6ca; }

  /* número partit en trossos de colors */
  .parts { display: flex; align-items: flex-start; justify-content: center; gap: 6px; font-size: clamp(2.8rem, 12vw, 4.6rem); font-weight: 700; line-height: 1.05; }
  .grp { display: flex; flex-direction: column; align-items: center; color: var(--g); padding: 2px 8px 6px; border-radius: 16px; transition: background .2s; }
  .grp small { font-size: .85rem; color: #fff; opacity: .9; font-weight: 600; border-top: 5px solid var(--g); padding-top: 3px; width: 100%; text-align: center; line-height: 1.1; white-space: nowrap; }
  .grp.on { background: rgba(255,255,255,.14); box-shadow: 0 0 0 3px var(--g); animation: pulse 1.4s infinite; }
  .grp.zero { opacity: .35; }
  .dotsep { color: #fff; opacity: .8; }
  .built { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; background: rgba(255,255,255,.95); border-radius: 18px; padding: 10px; min-height: 64px; width: 100%; max-width: 760px; }
  .built.right { background: #b9f6ca; }
  .slot-t { padding: 6px 14px; border-radius: 12px; border: 3px dashed var(--g); color: #999; font-size: 1.4rem; font-weight: 600; min-width: 80px; text-align: center; }
  .slot-t.done { border-style: solid; background: var(--g); color: #222; animation: pop .35s both; }
  .step-q { font-size: 1.35rem; text-align: center; line-height: 1.4; }
  .choices.one-col { grid-template-columns: 1fr; max-width: 520px; }
  .preview { font-size: 1.8rem; font-weight: 700; min-height: 1.3em; color: var(--gold); text-align: center; }
  .wtile.con { background: linear-gradient(#fff3c4, #ffd23f); color: #4a2a00; box-shadow: 0 5px 0 #c9971a; min-width: 56px; }
  @media (max-width: 500px) {
    .grp { padding: 2px 4px 4px; } .grp small { font-size: .7rem; }
    .slot-t { font-size: 1.15rem; min-width: 60px; padding: 4px 10px; }
    .step-q { font-size: 1.15rem; } .preview { font-size: 1.5rem; }
    .wtile { font-size: 1.25rem; padding: 8px 12px; }
  }
  .rules { text-align: left; background: #f3ecff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-size: 1rem; line-height: 1.5; }

  /* diccionari */
  .dict { text-align: left; font-size: 1.05rem; max-height: 60vh; overflow: auto; columns: 2; column-gap: 24px; }
  .dict div { break-inside: avoid; padding: 2px 0; }
  .dict b { display: inline-block; min-width: 54px; color: #7b2ff7; }

  /* combat final */
  .boss-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(0,0,0,.25); border-radius: 22px; padding: 10px 16px; position: relative; overflow: hidden; }
  .boss-side { display: flex; align-items: center; gap: 10px; }
  .boss-side .who { font-size: 3.2rem; line-height: 1; }
  .boss-side .who svg { width: 70px; height: auto; display: block; }
  .hp { width: 160px; height: 18px; background: rgba(255,255,255,.2); border-radius: 9px; overflow: hidden; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a5f, #ffb347); transition: width .4s; }
  .shields { font-size: 1.6rem; letter-spacing: .1em; }
  .shields span.off { filter: grayscale(1) opacity(.25); }
  .shields { white-space: nowrap; }
  @media (max-width: 500px) {
    .boss-bar { padding: 8px 10px; gap: 6px; margin-top: 4px; }
    .boss-side { gap: 6px; min-width: 0; }
    .boss-side .who { font-size: 2.2rem; }
    .boss-side .who svg { width: 44px; }
    .hp { width: 90px; height: 14px; }
    .shields { font-size: 1.15rem; letter-spacing: 0; }
    .beam { left: 40px; right: 50px; }
  }
  .beam { position: absolute; top: 50%; height: 6px; border-radius: 3px; left: 70px; right: 90px; transform-origin: left; animation: beam .35s ease-out forwards; }
  .beam.me { background: linear-gradient(90deg, #4fc3f7, #fff); }
  .beam.him { background: linear-gradient(270deg, #ff5a5f, #fff); transform-origin: right; }
  @keyframes beam { from { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1); opacity: 0; } }
  .hit { animation: shake .45s, flash .45s; }
  @keyframes flash { 50% { filter: brightness(2.5) drop-shadow(0 0 12px #fff); } }

  /* diploma */
  .diploma { background: #fffaf0; color: #3b2b12; border: 10px double #d4a017; border-radius: 16px; padding: 26px; text-align: center; max-width: 640px; margin: 90px auto 30px; }
  .diploma h1 { font-size: 2.4rem; margin: .2em 0; color: #7b2ff7; }
  .diploma .name { font-size: 3rem; font-weight: 700; color: #d35400; }
  @media print { body { background: #fff; } #stars { display: none; } .diploma { margin-top: 0; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app"></div>
<script src="../../comu/comu.js"></script>
<script src="nombres-ca.js"></script>
<script src="joc.js"></script>
</body>
</html>
